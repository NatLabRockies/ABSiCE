# ABSiCE att_distrib_param_eol Calibration Sweep — TORC/Slurm Workflow
#
# Purpose: find the att_mean value that produces ~20% recycling rate at the
#   25 USD/module processing cost and initial recycling rate = 20%.
#
# --cost-rate is in USD/kg of an 18.9 kg module: 25 USD/module =
# 1.322751322751323 USD/kg (twice the 12.5 USD/module baseline).
#
# A scenario can use an optional settings file to replace selected values in
# the chosen base config. Write one settings file for each condition listed
# below, named hpc/run_settings_<condition>.yaml. Replace the example condition
# names and matching results folders with names chosen for your own sweep.
#
# Setup:
#   - 6 attitude values × 2 conditions = 12 jobs
#   - 100 replicates per job, 11 simulation years each
#   - att_std fixed at 0.1
#   - Results go to results/att_calibration/<condition>/...
#
# Submission:
#   TORC_ACCOUNT=pvabm ./hpc/submit.sh att_calibration
#
# After the run completes, analyse results with:
#   python hpc/analyze_att_calibration.py --results-base results/att_calibration/<condition>

name: absice_att_calibration
description: >
  ABSiCE attitude calibration sweep across user-defined settings files.
  Fixes processing cost at 25 USD/module (1.322751322751323 USD/kg) and initial recycling rate at
  20%; sweeps the attitude distribution mean and condition name. Each condition
  uses a matching settings file and results folder under results/att_calibration/.
project: ABSiCE

# ── Resource requirements per job ─────────────────────────────────────────────
resource_requirements:
  - name: scenario
    num_cpus: 4
    num_gpus: 0
    num_nodes: 1
    memory: 64g
    runtime: PT8H

slurm_schedulers:
  - name: cpu_nodes
    account: pvabm
    partition: standard
    nodes: 4
    walltime: "48:00:00"
    extra: "--mail-user=<YOUR_EMAIL> --mail-type=BEGIN,END,FAIL"

actions:
  - trigger_type: on_workflow_start
    action_type: schedule_nodes
    scheduler: cpu_nodes
    scheduler_type: slurm
    num_allocations: 1

# ── Jobs ──────────────────────────────────────────────────────────────────────
jobs:
  # --landfill-set all_landfills below is only used by RTN jobs (--rtn true);
  # non-RTN jobs in this sweep ignore it (it does not affect the run or the
  # output label). It is kept in the shared command because a single job spec
  # cannot omit a flag per swept rtn value.
  - name: att_calib_{condition}_rtn{rtn}_m{att_mean:.2f}
    command: >-
      module load conda &&
      conda activate <CONDA_ENV_PATH> &&
      python hpc/run_single_scenario.py
      --landfill-set all_landfills
      --cost-rate 1.322751322751323
      --cost-component recycling
      --rtn {rtn}
      --settings-file hpc/run_settings_{condition}.yaml
      --recycle-rate 0.20
      --att-mean {att_mean}
      --att-std 0.1
      --n-runs 100
      --n-steps 11
      --results-base results/att_calibration/{condition}
    resource_requirements: scenario
    scheduler: cpu_nodes

    # Example conditions; replace these names and create one matching settings
    # file for each. Six attitude values × two conditions make 12 jobs.
    parameters:
      att_mean: "[0.60,0.61,0.62,0.63,0.64,0.65]"
      condition: "['scenario_a','scenario_b']"
      rtn: "['false']"
    parameter_mode: product

    failure_handler: retry_once

failure_handlers:
  - name: retry_once
    rules:
      - match_all_exit_codes: true
        max_retries: 1
